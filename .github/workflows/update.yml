name: 空室データの自動更新

on:
  schedule:
    - cron: "17 * * * *"     # 1時間おき(毎時17分)に空室を取得。サイトの公開は約2時間ごと(下の「公開するか決める」)。
                             # Cloudflare Pagesの無料枠(月500回の公開)に収まる回数(月約360回)
  workflow_dispatch:          # 手動で実行したいとき用(Actionsタブの「Run workflow」)
    inputs:
      reprobe:
        description: "「露天あり」の判定をやり直す(普段はオフのまま)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-vacancy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50   # 前回の公開がいつだったかを、保存の履歴から調べるため

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 公開するか決める(前回の公開から約2時間ごと。手動実行の回は必ず公開)
        id: plan
        run: |
          # GitHubの自動実行は開始が遅れることがあるので、時刻ではなく「前回の公開からの経過時間」で決める。
          # 1時間おきの回のうち1回おきに公開する形になる(開始時点で50分以上たっていれば公開。前の回の直後に始まった回は見送る)
          LAST=$(git log -1 --format=%ct --fixed-strings --invert-grep --grep='[CF-Pages-Skip]' || true)
          MIN=$(( ( $(date +%s) - ${LAST:-0} ) / 60 ))
          echo "前回の公開から ${MIN} 分"
          if [ "${{ github.event_name }}" != "schedule" ] || [ -z "$LAST" ] || [ "$MIN" -ge 50 ]; then
            echo "deploy=1" >> "$GITHUB_OUTPUT"; echo "この回はサイトを公開します"
          else
            echo "deploy=0" >> "$GITHUB_OUTPUT"; echo "この回はデータだけ保存します(公開は次の回)"
          fi

      - name: 楽天トラベルから空室を取得
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: |
          if [ "${{ inputs.reprobe }}" = "true" ]; then
            python scripts/update.py --budget-minutes 45 --reprobe
          else
            python scripts/update.py --budget-minutes 45
          fi

      - name: ページを作成
        env:
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: python scripts/build.py

      - name: 変更があれば保存(公開サイトも自動で更新されます)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data public
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            if [ "${{ steps.plan.outputs.deploy }}" = "1" ]; then
              git commit -m "空室データを更新"
            else
              git commit -m "空室データを更新(公開は次の回) [CF-Pages-Skip]"
            fi
            # 実行中に誰かが(自分でファイルを更新したときなど)保存していた場合は、取り込んでからやり直す
            for i in 1 2 3; do
              git push && break
              git pull --rebase -X theirs origin main
            done
          fi

      - name: 更新をBing等に通知(IndexNow)
        if: steps.plan.outputs.deploy == '1'
        continue-on-error: true
        run: |
          sleep 180   # 公開サイトが更新されるのを待つ
          python scripts/indexnow.py
          git add data/indexnow.json || true
          if ! git diff --cached --quiet; then
            git commit -m "IndexNow通知の記録 [CF-Pages-Skip]"
            for i in 1 2 3; do
              git push && break
              git pull --rebase -X theirs origin main
            done
          fi
